<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>施工写真｜三重現状回復サービス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Antique+Soft&display=swap">
<style>
/* Layout: 事例ごとに「ビフォー｜アフター」を左右に並べたカードを縦に積む。スマホでは上下。 */
:root{
  --bg:#f6f7f4;--surface:#ffffff;--ink:#1d2a2a;--muted:#5b6866;--line:#d9dfdb;
  --accent:#2f6b4f;--accent-soft:#e3eee7;--warm:#b9772f;--on-accent:#ffffff;
  --before:#ecebe6;--before-ink:#7a776c;
  --font-display:"Zen Antique Soft","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a19;--surface:#1c2423;--ink:#e8eeeb;--muted:#a3b0ac;--line:#2f3a38;
  --accent:#7cc3a0;--accent-soft:#22332c;--warm:#e0a868;--on-accent:#10201a;
  --before:#262a28;--before-ink:#9a978c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19;--surface:#1c2423;--ink:#e8eeeb;--muted:#a3b0ac;--line:#2f3a38;
  --accent:#7cc3a0;--accent-soft:#22332c;--warm:#e0a868;--on-accent:#10201a;
  --before:#262a28;--before-ink:#9a978c;color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.8;margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-size:1.25rem;letter-spacing:.06em;color:var(--ink);text-decoration:none}
.top nav{display:flex;gap:18px;font-size:.9rem;flex-wrap:wrap}
.top nav a{color:var(--muted);text-decoration:none}
.top nav a[aria-current]{color:var(--accent);font-weight:700}

.intro{padding-block:56px 28px}
.eyebrow{font-size:.78rem;letter-spacing:.18em;color:var(--accent);font-weight:700}
.intro h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2rem,5vw,3rem);letter-spacing:.05em;margin-top:6px}
.intro p{max-width:34em;margin:14px 0 0;color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.filters button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 16px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.cases{display:grid;gap:28px;padding-block:20px 64px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
.shot{position:relative;margin:0;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;text-align:center}
.shot.b{background:var(--before);color:var(--before-ink)}
.shot.a{background:var(--accent-soft);color:var(--accent)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .ph{display:grid;gap:4px;justify-items:center;font-size:.9rem;padding:12px}
.shot .ph svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.4}
.tag{position:absolute;top:12px;left:12px;font-size:.75rem;font-weight:700;letter-spacing:.16em;padding:2px 10px;border-radius:4px;z-index:1}
.b .tag{background:var(--surface);color:var(--before-ink);border:1px solid var(--line)}
.a .tag{background:var(--accent);color:var(--on-accent)}
.arrow{display:grid;place-items:center;width:36px;background:var(--surface);color:var(--warm);font-size:1.3rem}
.meta{padding:20px 24px 24px;display:grid;gap:10px}
.meta h2{font-size:1.15rem}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--muted);margin:0;padding:0;list-style:none}
.facts b{color:var(--ink);font-weight:500;margin-right:4px}
.meta p{margin:0;font-size:.95rem;max-width:44em}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:40px 24px;text-align:center;color:var(--muted);margin:0}
.sample{font-size:.75rem;color:var(--warm);border:1px solid currentColor;border-radius:4px;padding:0 6px;margin-left:8px;vertical-align:middle;font-weight:500}

.cta{border-top:1px solid var(--line);padding-block:44px;text-align:left}
.cta .wrap{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between}
.cta p{margin:0;font-size:1.05rem}
.cta .tel{font-size:1.7rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent);user-select:all;text-decoration:none}
footer{border-top:1px solid var(--line);padding-block:28px;font-size:.85rem;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:640px){
  .pair{grid-template-columns:1fr}
  .arrow{width:auto;height:30px;transform:rotate(90deg)}
  .top nav{font-size:.85rem;gap:14px}
}

/* ページ切替タブ */
.tabs{display:flex;gap:4px;padding-top:2px}
.tabs a{flex:1;max-width:220px;text-align:center;padding:9px 12px;font-weight:700;font-size:.95rem;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent}
.tabs a:hover{color:var(--accent)}
.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html">三重現状回復サービス</a>
    <nav aria-label="サイト内リンク">
      <a href="index.html">トップ</a><a href="works.html" aria-current="page">施工写真</a><a href="index.html#price">料金の目安</a><a href="index.html#contact">お問い合わせ</a>
    </nav>
  </div>

  <div class="wrap tabs" role="navigation" aria-label="ページ切替"><a href="index.html">トップページ</a><a href="works.html" aria-current="page">施工写真</a></div>
</header>

<main>
  <div class="intro">
    <div class="wrap">
      <span class="eyebrow">WORKS</span>
      <h1>施工写真</h1>
      <p>実際に手がけたお部屋の、工事前と工事後です。退去後の状態からどこまで戻せるか、写真でご確認ください。</p>
      <div class="filters" role="group" aria-label="工事の種類で絞り込む">
        <button type="button" aria-pressed="true" data-f="all">すべて</button>
        <button type="button" aria-pressed="false" data-f="ikkatsu">原状回復一式</button>
        <button type="button" aria-pressed="false" data-f="mizu">水回り</button>
        <button type="button" aria-pressed="false" data-f="tatami">畳</button>
        <button type="button" aria-pressed="false" data-f="kabe">クロス・床</button>
      </div>
    </div>
  </div>

  <div class="wrap cases" id="cases"></div>
</main>

<section class="cta">
  <div class="wrap">
    <p>同じような状態のお部屋も、まずはご相談ください。</p>
    <a class="tel" href="tel:09050019172">090-5001-9172</a>
  </div>
</section>

<footer>
  <div class="wrap"><span>三重現状回復サービス｜三重県伊賀市真泥3297</span><span>TEL 090-5001-9172</span></div>
</footer>

<script>
// 写真が届いたら before / after にファイル名を入れるだけで差し替わります。
var CASES = [
  // 例: {f:'ikkatsu', title:'2DKアパート 原状回復一式', area:'伊賀市', plan:'2DK', days:'3日', work:'クロス張替え・床補修・クリーニング', text:'説明文', before:'img/case1-before.jpg', after:'img/case1-after.jpg'},
]

var cam = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/></svg>';
function shot(cls, label, src, title){
  var inner = src
    ? '<img src="'+src+'" alt="'+title+'（'+label+'）" loading="lazy">'
    : '<div class="ph">'+cam+'<span>'+label+'の写真がここに入ります</span></div>';
  return '<figure class="shot '+cls+'"><span class="tag">'+(cls==='b'?'BEFORE':'AFTER')+'</span>'+inner+'</figure>';
}
var box = document.getElementById('cases');
if (!CASES.length) { document.querySelector('.filters').hidden = true; }
box.innerHTML = CASES.map(function(c){
  var sample = (!c.before && !c.after) ? '<span class="sample">見本</span>' : '';
  return '<article class="case" data-f="'+c.f+'">'
    + '<div class="pair">'+shot('b','工事前',c.before,c.title)+'<div class="arrow" aria-hidden="true">→</div>'+shot('a','工事後',c.after,c.title)+'</div>'
    + '<div class="meta"><h2>'+c.title+sample+'</h2>'
    + '<ul class="facts"><li><b>場所</b>'+c.area+'</li><li><b>間取り</b>'+c.plan+'</li><li><b>工期</b>'+c.days+'</li><li><b>工事内容</b>'+c.work+'</li></ul>'
    + '<p>'+c.text+'</p></div></article>';
}).join('') || '<p class="empty">施工写真の写真は準備中です。工事前・工事後の写真を順次掲載していきます。</p>';

document.querySelectorAll('.filters button').forEach(function(btn){
  btn.addEventListener('click', function(){
    var f = btn.dataset.f;
    document.querySelectorAll('.filters button').forEach(function(b){ b.setAttribute('aria-pressed', b===btn ? 'true':'false'); });
    box.querySelectorAll('.case').forEach(function(el){ el.hidden = !(f==='all' || el.dataset.f===f); });
  });
});
</script>
</body>
</html>
